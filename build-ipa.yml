name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      export_method:
        description: IPA export method
        type: choice
        required: true
        default: ad-hoc
        options:
          - ad-hoc
          - app-store-connect
          - development

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and export IPA
    runs-on: macos-15
    env:
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
      BUNDLE_ID: com.neirahtech.PrivateMediaPlayer
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=()
          [[ -n "$CERTIFICATE_BASE64" ]] || missing+=(IOS_CERTIFICATE_BASE64)
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=(IOS_CERTIFICATE_PASSWORD)
          [[ -n "$PROFILE_BASE64" ]] || missing+=(IOS_PROVISIONING_PROFILE_BASE64)
          [[ -n "$TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          if (( ${#missing[@]} )); then
            printf 'Missing repository or environment secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install signing certificate and provisioning profile
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/signing-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          PROFILE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist" | sed 's/^[^.]*\.//')
          if [[ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" && "$PROFILE_BUNDLE_ID" != *\* ]]; then
            echo "Provisioning profile is for $PROFILE_BUNDLE_ID, but the app bundle ID is $BUNDLE_ID" >&2
            exit 1
          fi

      - name: Select signing identity and export method
        shell: bash
        run: |
          case "$EXPORT_METHOD" in
            ad-hoc|app-store-connect)
              echo 'SIGNING_IDENTITY=Apple Distribution' >> "$GITHUB_ENV"
              ;;
            development)
              echo 'SIGNING_IDENTITY=Apple Development' >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported export method: $EXPORT_METHOD" >&2
              exit 1
              ;;
          esac

      - name: Archive app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMediaPlayer.xcodeproj \
            -scheme PrivateMediaPlayer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/PrivateMediaPlayer.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            IPHONEOS_DEPLOYMENT_TARGET=9.0

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$RUNNER_TEMP/ExportOptions.plist" 2>/dev/null || true
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PrivateMediaPlayer.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -s "$RUNNER_TEMP/export/PrivateMediaPlayer.ipa"
          mkdir -p build/ipa
          cp "$RUNNER_TEMP/export/PrivateMediaPlayer.ipa" build/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateMediaPlayer-IPA
          path: build/ipa/PrivateMediaPlayer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
